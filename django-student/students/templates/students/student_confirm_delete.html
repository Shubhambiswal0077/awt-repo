{% extends 'students/base.html' %}

{% block title %}Delete Student{% endblock %}

{% block content %}
    <p>Are you sure you want to delete "{{ student.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'student_list' %}">Cancel</a>
    </form>
{% endblock %}
